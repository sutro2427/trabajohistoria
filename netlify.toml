[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# El juego de cartas vive en su propio sitio (carpeta sitio-vietnam/). Aquí solo
# queda el atajo. Va ANTES del comodín de la SPA: Netlify aplica las reglas en
# orden y /* se quedaría con /vietnam.
[[redirects]]
  from = "/vietnam"
  to = "https://linea-tiempo-vietnam.netlify.app/"
  status = 301
  force = true

# SPA de una sola página: cualquier ruta sirve el index.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Los bundles llevan hash en el nombre: se pueden cachear para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
